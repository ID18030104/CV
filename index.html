<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isaac Derhy - CV Interactif</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
          },
          colors: {
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
            accent: {
              50: '#fff1f2',
              100: '#ffe4e6',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
            'bounce-subtle': 'bounceSubtle 2s infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(-5%)' },
              '50%': { transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      /* slate-50 */
      color: #1e293b;
      /* slate-800 */
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Custom utility for animation delays */
    .delay-100 {
      animation-delay: 100ms;
    }

    .delay-200 {
      animation-delay: 200ms;
    }

    .delay-300 {
      animation-delay: 300ms;
    }

    /* =========================
       Print / PDF stylesheet
       Used by browser print AND by headless Chrome
       when generating cv-{fr,en,zh}.pdf
       ========================= */
    @media print {
      @page {
        size: A4;
        margin: 10mm 8mm;
      }

      html,
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide everything flagged no-print (navbar, CTA buttons, etc.) */
      .no-print,
      nav {
        display: none !important;
      }

      /* Shrink the hero so it doesn't take a full A4 page */
      main > div:first-of-type {
        min-height: 0 !important;
      }

      main {
        max-width: 100% !important;
        border: none !important;
        box-shadow: none !important;
      }

      /* Hero wrapper: remove the 90vh minimum + top padding meant for the navbar */
      .min-h-\[90vh\] {
        min-height: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 1rem !important;
      }

      /* Remove the blinking typewriter caret in print */
      .animate-pulse {
        animation: none !important;
      }

      /* Skill progress bars rely on IntersectionObserver to animate in.
         In headless print there is no scroll, so force their target width. */
      .print-force-width {
        width: var(--print-width) !important;
        transition: none !important;
      }

      /* Scroll-reveal cards: make sure they always show at full opacity in print */
      .opacity-0 {
        opacity: 1 !important;
      }

      .translate-y-10 {
        transform: none !important;
      }

      /* Keep each section on its own page-flow block */
      section {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Avoid breaking timeline cards and project cards across pages */
      .group {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Reduce vertical gaps a bit to pack content better on A4 */
      .space-y-8 > * + * {
        margin-top: 1.25rem !important;
      }

      .space-y-12 > * + * {
        margin-top: 1.5rem !important;
      }

      .py-12 {
        padding-top: 1.25rem !important;
        padding-bottom: 1.25rem !important;
      }

      .md\:py-16 {
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
      }

      .pb-20 {
        padding-bottom: 0 !important;
      }

      .pt-20 {
        padding-top: 0 !important;
      }

      /* Footer promo card is a CTA → hide in print */
      footer .bg-slate-900 {
        display: none !important;
      }
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
